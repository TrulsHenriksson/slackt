<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="./src/style.css" />
        <script type="module" src="./src/account.ts"></script>
        <title>Slackt - Fyrgeit.se</title>
    </head>
    <body>
        <header>
            <h1>Slackt</h1>
            <h2><a href="index.html">Redigerare</a></h2>
            <h2><a href="viewer.html">Utforskare</a></h2>
            <h2><a href="tools.html">Verktyg</a></h2>
            <p>Tillbaka till <a href="https://fyrgeit.se">Fyrgeit.se</a></p>
            <p id="userInfo">Inte inloggad</p>
        </header>

        <div id="menuButtons">
            <button
                class="textButton"
                onclick="document.getElementById('open').click()"
            >
                Öppna
            </button>
            <input type="file" id="open" accept=".json" style="display: none" />
            <button class="textButton" id="save">Spara</button>
            <button class="textButton" id="clear">Rensa</button>
        </div>
        <form id="signupForm">
            <input type="text" name="email" placeholder="Email" />
            <input type="password" name="password" placeholder="Password" />
            <button type="submit" id="signup">Sign up</button>
        </form>
        <form id="loginForm">
            <input type="text" name="email" placeholder="Email" />
            <input type="password" name="password" placeholder="Password" />
            <button type="submit" id="login">Log in</button>
        </form>
        <button id="getInfo">Get info</button>
    </body>
</html>
